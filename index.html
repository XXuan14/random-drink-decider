<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="隨機飲料決定器：用飲料類型、溫度、甜度與咖啡因條件，快速幫你決定今天喝什麼。" />
  <title>今天喝什麼？｜隨機飲料決定器</title>
  <style>
    :root {
      --bg: #fff8ee;
      --surface: #ffffff;
      --surface-2: #fff3df;
      --text: #30271f;
      --muted: #7d6e62;
      --primary: #d97845;
      --primary-dark: #b95e31;
      --accent: #6f9b78;
      --border: #eadbc9;
      --shadow: 0 14px 35px rgba(96, 67, 43, 0.10);
      --radius: 24px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC",
        "Microsoft JhengHei", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, #fff1d8 0, transparent 34%),
        radial-gradient(circle at bottom right, #eef7ed 0, transparent 30%),
        var(--bg);
      line-height: 1.6;
    }

    button, select, input { font: inherit; }

    button:focus-visible,
    select:focus-visible,
    input:focus-visible {
      outline: 3px solid rgba(217, 120, 69, 0.28);
      outline-offset: 3px;
    }

    .page {
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
      padding: 44px 0 56px;
    }

    .hero {
      text-align: center;
      margin-bottom: 28px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 12px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: rgba(255,255,255,0.72);
      color: var(--muted);
      font-size: 14px;
      font-weight: 700;
    }

    h1 {
      margin: 12px 0 8px;
      font-size: clamp(34px, 7vw, 62px);
      line-height: 1.08;
      letter-spacing: -0.04em;
    }

    .hero p {
      margin: 0 auto;
      max-width: 620px;
      color: var(--muted);
      font-size: 17px;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 0.92fr);
      gap: 22px;
      align-items: stretch;
    }

    .card {
      background: rgba(255,255,255,0.9);
      border: 1px solid rgba(234,219,201,0.9);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 24px;
    }

    .card h2 {
      margin: 0 0 6px;
      font-size: 21px;
    }

    .hint {
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 14px;
    }

    .group + .group {
      margin-top: 20px;
    }

    .group-title {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
      margin-bottom: 10px;
      font-weight: 800;
    }

    .group-title small {
      color: var(--muted);
      font-weight: 600;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
    }

    .chip {
      position: relative;
    }

    .chip input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .chip span {
      display: inline-flex;
      min-height: 42px;
      align-items: center;
      justify-content: center;
      padding: 8px 13px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text);
      cursor: pointer;
      user-select: none;
      transition: 0.16s ease;
    }

    .chip input:checked + span {
      border-color: var(--primary);
      background: #fff0e8;
      color: var(--primary-dark);
      font-weight: 800;
    }

    @media (hover:hover) {
      .chip span:hover {
        border-color: #d9bfa8;
        transform: translateY(-1px);
      }
    }

    .select-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    label.select-label {
      display: grid;
      gap: 7px;
      font-weight: 800;
      font-size: 14px;
    }

    select {
      width: 100%;
      min-height: 46px;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 0 13px;
      background: #fff;
      color: var(--text);
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 24px;
    }

    .btn {
      border: 0;
      border-radius: 15px;
      min-height: 48px;
      padding: 11px 18px;
      cursor: pointer;
      font-weight: 900;
      transition: 0.16s ease;
    }

    .btn-primary {
      flex: 1 1 180px;
      color: white;
      background: var(--primary);
      box-shadow: 0 8px 18px rgba(217,120,69,0.24);
    }

    .btn-secondary {
      color: var(--text);
      background: var(--surface-2);
      border: 1px solid var(--border);
    }

    .btn:active { transform: translateY(1px) scale(0.99); }

    .result-card {
      position: relative;
      overflow: hidden;
      min-height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      text-align: center;
      background:
        linear-gradient(160deg, rgba(255,255,255,0.96), rgba(255,246,232,0.96));
    }

    .result-card::before {
      content: "";
      position: absolute;
      width: 180px;
      height: 180px;
      border-radius: 50%;
      background: rgba(111,155,120,0.10);
      top: -60px;
      right: -50px;
    }

    .result-emoji {
      font-size: 78px;
      line-height: 1;
      margin-bottom: 12px;
      filter: drop-shadow(0 10px 18px rgba(71,54,42,0.10));
    }

    .result-title {
      margin: 0;
      font-size: clamp(30px, 5vw, 46px);
      line-height: 1.15;
    }

    .result-copy {
      margin: 8px auto 18px;
      max-width: 430px;
      color: var(--muted);
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin-bottom: 18px;
    }

    .tag {
      padding: 6px 10px;
      border-radius: 999px;
      background: #fff;
      border: 1px solid var(--border);
      font-size: 13px;
      font-weight: 800;
      color: #5e5046;
    }

    .status {
      min-height: 25px;
      margin: 2px 0 0;
      font-size: 14px;
      color: var(--muted);
    }

    .result-actions {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .history {
      margin-top: 22px;
    }

    .history h2 {
      margin: 0 0 12px;
      font-size: 20px;
    }

    .history-list {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 10px;
    }

    .history-item {
      min-width: 0;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: rgba(255,255,255,0.82);
      padding: 12px;
      text-align: center;
    }

    .history-item .emoji {
      font-size: 26px;
      line-height: 1.2;
    }

    .history-item .name {
      margin-top: 5px;
      font-size: 13px;
      font-weight: 800;
      overflow-wrap: anywhere;
    }

    .empty-history {
      grid-column: 1 / -1;
      color: var(--muted);
      text-align: center;
      padding: 16px 8px;
      border: 1px dashed var(--border);
      border-radius: 16px;
      background: rgba(255,255,255,0.45);
    }

    .footer-note {
      text-align: center;
      margin-top: 18px;
      color: var(--muted);
      font-size: 13px;
    }

    .shake {
      animation: shake 0.55s ease;
    }

    @keyframes shake {
      0%,100% { transform: rotate(0deg) scale(1); }
      20% { transform: rotate(-4deg) scale(1.03); }
      40% { transform: rotate(4deg) scale(1.03); }
      60% { transform: rotate(-3deg) scale(1.02); }
      80% { transform: rotate(3deg) scale(1.01); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }

    @media (max-width: 820px) {
      .layout { grid-template-columns: 1fr; }
      .result-card { min-height: 420px; }
      .history-list { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 520px) {
      .page {
        width: min(100% - 20px, 1120px);
        padding-top: 26px;
      }
      .card { padding: 18px; border-radius: 20px; }
      .select-row { grid-template-columns: 1fr; }
      .history-list { grid-template-columns: 1fr 1fr; }
      .btn-secondary { flex: 1 1 130px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="hero">
      <div class="eyebrow">🥤 Random Drink Decider</div>
      <h1>今天喝什麼？</h1>
      <p>選幾個偏好，剩下的交給運氣。選擇困難的今天，也能 3 秒決定一杯。</p>
    </section>

    <section class="layout">
      <form class="card" id="filterForm">
        <h2>先告訴我你的心情</h2>
        <p class="hint">都不選也可以，我會直接從全部飲料裡抽一杯。</p>

        <div class="group">
          <div class="group-title">
            <span>飲料類型</span>
            <small>可複選</small>
          </div>
          <div class="chips" id="categoryChips">
            <label class="chip"><input type="checkbox" value="茶類"><span>🍵 茶類</span></label>
            <label class="chip"><input type="checkbox" value="奶茶"><span>🧋 奶茶</span></label>
            <label class="chip"><input type="checkbox" value="咖啡"><span>☕ 咖啡</span></label>
            <label class="chip"><input type="checkbox" value="果汁"><span>🍊 果汁</span></label>
            <label class="chip"><input type="checkbox" value="氣泡"><span>🥤 氣泡</span></label>
            <label class="chip"><input type="checkbox" value="其他"><span>🍫 其他</span></label>
          </div>
        </div>

        <div class="group select-row">
          <label class="select-label">
            溫度
            <select id="temperature">
              <option value="不限">不限</option>
              <option value="冷">冷飲</option>
              <option value="熱">熱飲</option>
            </select>
          </label>

          <label class="select-label">
            甜度
            <select id="sweetness">
              <option value="不限">不限</option>
              <option value="無糖">無糖</option>
              <option value="微糖">微糖</option>
              <option value="半糖">半糖</option>
              <option value="正常甜">正常甜</option>
            </select>
          </label>
        </div>

        <div class="group">
          <div class="group-title">
            <span>咖啡因</span>
          </div>
          <div class="chips" role="radiogroup" aria-label="咖啡因偏好">
            <label class="chip"><input type="radio" name="caffeine" value="不限" checked><span>都可以</span></label>
            <label class="chip"><input type="radio" name="caffeine" value="無"><span>🌙 不要咖啡因</span></label>
            <label class="chip"><input type="radio" name="caffeine" value="有"><span>⚡ 可以有咖啡因</span></label>
          </div>
        </div>

        <div class="actions">
          <button class="btn btn-primary" id="decideBtn" type="submit">🎲 幫我決定！</button>
          <button class="btn btn-secondary" id="resetBtn" type="button">清除條件</button>
        </div>
      </form>

      <section class="card result-card" aria-live="polite" aria-atomic="true">
        <div id="resultVisual" class="result-emoji" aria-hidden="true">🥤</div>
        <h2 class="result-title" id="resultName">準備好了嗎？</h2>
        <p class="result-copy" id="resultCopy">設定偏好後按下「幫我決定！」，我會替你挑一杯。</p>
        <div class="tags" id="resultTags" hidden></div>
        <p class="status" id="status"></p>
        <div class="result-actions">
          <button class="btn btn-secondary" id="againBtn" type="button" disabled>再抽一次</button>
        </div>
      </section>
    </section>

    <section class="history card">
      <h2>最近抽到的 5 杯</h2>
      <div class="history-list" id="historyList">
        <div class="empty-history">還沒有紀錄，先抽第一杯吧！</div>
      </div>
    </section>

    <p class="footer-note">Made with Vibe Coding ✨ 喝飲料也別忘了適量補充白開水。</p>
  </main>

  <script>
    (() => {
      const drinks = [
        { name:"四季春青茶", category:"茶類", temperatures:["冷","熱"], sweetness:["無糖","微糖","半糖"], caffeine:true, emoji:"🍵", copy:"清爽又耐喝，今天就走一個簡單不出錯的路線。" },
        { name:"烏龍茶", category:"茶類", temperatures:["冷","熱"], sweetness:["無糖","微糖","半糖"], caffeine:true, emoji:"🍵", copy:"茶香比較厚，適合想喝有存在感但不膩的你。" },
        { name:"紅茶", category:"茶類", temperatures:["冷","熱"], sweetness:["無糖","微糖","半糖","正常甜"], caffeine:true, emoji:"🫖", copy:"經典派永遠不退流行，今天就選一杯安心牌。" },
        { name:"綠茶", category:"茶類", temperatures:["冷","熱"], sweetness:["無糖","微糖","半糖"], caffeine:true, emoji:"🍃", copy:"清新俐落，適合想讓腦袋重新開機的時候。" },
        { name:"冬瓜茶", category:"茶類", temperatures:["冷"], sweetness:["半糖","正常甜"], caffeine:false, emoji:"🧊", copy:"古早味甜甜的，今天需要一點療癒感。" },
        { name:"珍珠奶茶", category:"奶茶", temperatures:["冷","熱"], sweetness:["微糖","半糖","正常甜"], caffeine:true, emoji:"🧋", copy:"今天值得一杯有料的，珍珠就是快樂加成。" },
        { name:"烏龍奶茶", category:"奶茶", temperatures:["冷","熱"], sweetness:["無糖","微糖","半糖"], caffeine:true, emoji:"🧋", copy:"茶感和奶香平衡，低調但很有品味。" },
        { name:"伯爵奶茶", category:"奶茶", temperatures:["冷","熱"], sweetness:["微糖","半糖","正常甜"], caffeine:true, emoji:"🫖", copy:"帶一點香氣感，適合今天想喝得精緻一點。" },
        { name:"黑糖鮮奶", category:"奶茶", temperatures:["冷","熱"], sweetness:["半糖","正常甜"], caffeine:false, emoji:"🥛", copy:"濃郁系登場，今天就讓黑糖幫你補充幸福感。" },
        { name:"美式咖啡", category:"咖啡", temperatures:["冷","熱"], sweetness:["無糖"], caffeine:true, emoji:"☕", copy:"乾脆俐落，需要清醒就交給這杯。" },
        { name:"拿鐵", category:"咖啡", temperatures:["冷","熱"], sweetness:["無糖","微糖","半糖"], caffeine:true, emoji:"☕", copy:"咖啡和奶香剛剛好，是今天的溫柔醒腦方案。" },
        { name:"焦糖瑪奇朵", category:"咖啡", temperatures:["冷","熱"], sweetness:["半糖","正常甜"], caffeine:true, emoji:"🍮", copy:"甜一點沒關係，今天走犒賞自己的路線。" },
        { name:"柳橙汁", category:"果汁", temperatures:["冷"], sweetness:["無糖"], caffeine:false, emoji:"🍊", copy:"酸甜清爽，給今天一個有精神的開始。" },
        { name:"西瓜汁", category:"果汁", temperatures:["冷"], sweetness:["無糖","微糖"], caffeine:false, emoji:"🍉", copy:"清涼感直接拉滿，適合熱熱的午後。" },
        { name:"檸檬汁", category:"果汁", temperatures:["冷"], sweetness:["微糖","半糖"], caffeine:false, emoji:"🍋", copy:"酸酸甜甜，今天來點醒腦的清爽感。" },
        { name:"百香果汁", category:"果汁", temperatures:["冷"], sweetness:["微糖","半糖","正常甜"], caffeine:false, emoji:"🥭", copy:"香氣很有存在感，適合不想喝太普通的你。" },
        { name:"檸檬氣泡飲", category:"氣泡", temperatures:["冷"], sweetness:["無糖","微糖","半糖"], caffeine:false, emoji:"🫧", copy:"氣泡加檸檬，一口把猶豫全部沖掉。" },
        { name:"可樂", category:"氣泡", temperatures:["冷"], sweetness:["正常甜"], caffeine:true, emoji:"🥤", copy:"經典就是有經典的道理，今天選快樂水。" },
        { name:"氣泡水", category:"氣泡", temperatures:["冷"], sweetness:["無糖"], caffeine:false, emoji:"🫧", copy:"想要有口感但不要負擔，這杯最乾脆。" },
        { name:"可可", category:"其他", temperatures:["冷","熱"], sweetness:["微糖","半糖","正常甜"], caffeine:false, emoji:"🍫", copy:"濃濃可可很適合需要被安慰一下的今天。" },
        { name:"抹茶鮮奶", category:"其他", temperatures:["冷","熱"], sweetness:["無糖","微糖","半糖"], caffeine:true, emoji:"🍵", copy:"微苦茶香配奶味，今天走成熟又柔和的路線。" },
        { name:"蜂蜜檸檬", category:"其他", temperatures:["冷","熱"], sweetness:["微糖","半糖"], caffeine:false, emoji:"🍯", copy:"酸甜舒服，想喝一杯不太有壓力的就選它。" }
      ];

      const form = document.getElementById("filterForm");
      const categoryChips = document.getElementById("categoryChips");
      const temperature = document.getElementById("temperature");
      const sweetness = document.getElementById("sweetness");
      const resetBtn = document.getElementById("resetBtn");
      const againBtn = document.getElementById("againBtn");
      const resultVisual = document.getElementById("resultVisual");
      const resultName = document.getElementById("resultName");
      const resultCopy = document.getElementById("resultCopy");
      const resultTags = document.getElementById("resultTags");
      const status = document.getElementById("status");
      const historyList = document.getElementById("historyList");

      let history = [];
      let lastPool = [];
      let busy = false;

      function getFilters() {
        const categories = [...categoryChips.querySelectorAll('input[type="checkbox"]:checked')].map(el => el.value);
        const caffeine = document.querySelector('input[name="caffeine"]:checked').value;
        return {
          categories,
          temperature: temperature.value,
          sweetness: sweetness.value,
          caffeine
        };
      }

      function getPool() {
        const f = getFilters();

        return drinks.filter(drink => {
          const categoryOK = f.categories.length === 0 || f.categories.includes(drink.category);
          const tempOK = f.temperature === "不限" || drink.temperatures.includes(f.temperature);
          const sweetOK = f.sweetness === "不限" || drink.sweetness.includes(f.sweetness);
          const caffeineOK =
            f.caffeine === "不限" ||
            (f.caffeine === "有" && drink.caffeine) ||
            (f.caffeine === "無" && !drink.caffeine);

          return categoryOK && tempOK && sweetOK && caffeineOK;
        });
      }

      function showNoResult() {
        resultVisual.textContent = "🤔";
        resultName.textContent = "這個條件太難了！";
        resultCopy.textContent = "目前沒有飲料符合全部條件，試著放寬一個篩選條件吧。";
        resultTags.hidden = true;
        resultTags.innerHTML = "";
        status.textContent = "0 杯符合條件";
        againBtn.disabled = true;
      }

      function renderResult(drink, poolSize) {
        resultVisual.textContent = drink.emoji;
        resultName.textContent = drink.name;
        resultCopy.textContent = drink.copy;

        const tempText = drink.temperatures.length === 2 ? "冷／熱皆可" : `${drink.temperatures[0]}飲`;
        const caffeineText = drink.caffeine ? "含咖啡因" : "無咖啡因";
        const sweetText = `甜度：${drink.sweetness.join("／")}`;

        resultTags.innerHTML = "";
        [drink.category, tempText, caffeineText, sweetText].forEach(text => {
          const span = document.createElement("span");
          span.className = "tag";
          span.textContent = text;
          resultTags.appendChild(span);
        });
        resultTags.hidden = false;
        status.textContent = `從 ${poolSize} 杯符合條件的飲料中抽中`;
        againBtn.disabled = false;

        resultVisual.classList.remove("shake");
        void resultVisual.offsetWidth;
        resultVisual.classList.add("shake");
      }

      function renderHistory() {
        historyList.innerHTML = "";
        if (history.length === 0) {
          const empty = document.createElement("div");
          empty.className = "empty-history";
          empty.textContent = "還沒有紀錄，先抽第一杯吧！";
          historyList.appendChild(empty);
          return;
        }

        history.forEach(drink => {
          const item = document.createElement("div");
          item.className = "history-item";

          const emoji = document.createElement("div");
          emoji.className = "emoji";
          emoji.textContent = drink.emoji;

          const name = document.createElement("div");
          name.className = "name";
          name.textContent = drink.name;

          item.append(emoji, name);
          historyList.appendChild(item);
        });
      }

      function randomPick(pool) {
        return pool[Math.floor(Math.random() * pool.length)];
      }

      function decide() {
        if (busy) return;
        const pool = getPool();
        lastPool = pool;

        if (pool.length === 0) {
          showNoResult();
          return;
        }

        busy = true;
        againBtn.disabled = true;
        status.textContent = "正在幫你想…";
        resultVisual.textContent = "🎲";
        resultName.textContent = "抽選中…";
        resultCopy.textContent = "交給命運幫你做最後決定。";
        resultTags.hidden = true;

        window.setTimeout(() => {
          const drink = randomPick(pool);
          history.unshift(drink);
          history = history.slice(0, 5);
          renderResult(drink, pool.length);
          renderHistory();
          busy = false;
        }, 520);
      }

      function resetAll() {
        form.reset();
        lastPool = [];
        resultVisual.textContent = "🥤";
        resultName.textContent = "準備好了嗎？";
        resultCopy.textContent = "設定偏好後按下「幫我決定！」，我會替你挑一杯。";
        resultTags.hidden = true;
        resultTags.innerHTML = "";
        status.textContent = "";
        againBtn.disabled = true;
      }

      form.addEventListener("submit", event => {
        event.preventDefault();
        decide();
      });

      againBtn.addEventListener("click", () => {
        if (!busy) decide();
      });

      resetBtn.addEventListener("click", resetAll);

      renderHistory();
    })();
  </script>
</body>
</html>
